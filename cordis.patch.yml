# dsh-back-to-chat — host plugin insertion.
#
# The host half is deliberately inert: all behaviour lives in the browser half
# (lib/client.js). This row exists so the package is an ENABLED Loader entry,
# which is what makes the host-side client-modules scanner publish
# `exports["./client"]` to the browser as a module.
#
# Keep the id stable: it is also the namespace you would use for a future
# host-side Config (`ctx.configForms.get('dsh-back-to-chat')`).
- insert:
    - id: dsh-back-to-chat
      name: dsh-back-to-chat
